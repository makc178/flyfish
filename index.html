<!doctype html><html lang="ru"><head><meta charset="utf-8">

<meta name="apple-mobile-web-app-title" content="Снасти"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Нахлыст. Снасти</title>
<style>
@font-face{font-family:Geist;src:url(Geist.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'Geist Mono';src:url(GeistMono.woff2) format('woff2');font-weight:100 900;font-display:swap}
:root{--bg:#0C0F12;--card:#161A1F;--ln:#262C35;--tx:#F4F6F8;--mut:#9AA4B0;--ac:#FF6B4A;--ok:#3DDC97;--edge:#FFD166;--fb:#FF6B4A;--apx:#9AA4B2;--mono:'Geist Mono',ui-monospace,monospace}

body{min-height:100vh;color:var(--tx);font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg);padding-bottom:calc(112px + env(safe-area-inset-bottom));font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums;overflow-x:hidden}
#app{max-width:520px;margin:0 auto;overflow-x:clip}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);letter-spacing:-.2px}
.w{padding:0 18px}.top{padding-top:calc(env(safe-area-inset-top) + 10px)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.h1{font-size:36px;font-weight:700;letter-spacing:-1px;line-height:1.05;text-wrap:balance}.big2{font-size:clamp(32px,10vw,42px);margin-top:4px;overflow-wrap:anywhere}

button.st{min-height:32px}
.s-ok{background:rgba(61,220,151,.14);color:var(--ok)}.s-edge{background:rgba(255,209,102,.14);color:var(--edge)}.s-fb{background:rgba(255,107,74,.15);color:#FF8466}.s-apx{background:rgba(154,164,178,.16);color:#B4BCC7}
.bdgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.bdgs.r{margin:0;flex:none;flex-direction:column;align-items:flex-end;max-width:52%}.bdgs.r .st{white-space:normal;text-align:right}
.tb{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));height:60px;border-radius:30px;background:rgba(30,35,42,.86);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);border:1px solid #2C333C;box-shadow:0 12px 30px rgba(0,0,0,.55);display:flex;align-items:center;padding:6px;gap:4px;z-index:20}
.tb button{height:48px;min-width:48px;padding:0 22px;border-radius:24px;font-size:16px;font-weight:600;color:var(--mut);display:flex;align-items:center;justify-content:center}.tb button.ic{padding:0 14px}.tb .on{background:var(--tx);color:var(--bg)}
.btn{display:block;width:100%;min-height:52px;background:var(--ac);color:#0C0F12;border-radius:16px;text-align:center;padding:14px;font-weight:700;font-size:16px}
.btn.l{background:var(--card);color:var(--tx);border:1px solid var(--ln)}.btn.r{background:transparent;color:#FF8466;border:1px solid rgba(255,107,74,.45)}
.seg{display:flex;gap:6px}.seg button{min-height:44px;padding:10px 16px;border-radius:22px;font-size:15px;font-weight:600;border:1px solid var(--ln);background:var(--card);white-space:nowrap}.seg .on{background:var(--tx);color:var(--bg);border-color:var(--tx)}.seg.wrap{flex-wrap:wrap}
.f{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:10px 14px;display:block}.f small{display:block;font-size:13px;color:var(--mut);font-weight:600}
.f input{display:block;width:100%;border:0;background:transparent;font-size:17px;font-weight:600;outline:0;padding:4px 0;min-height:32px}.f input::placeholder{color:var(--mut)}
.f:focus-within{border-color:var(--ac)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.it{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:12px;margin-bottom:10px}.it .hd{display:flex;gap:12px;align-items:center;cursor:pointer;min-height:56px}
.thumb{width:52px;height:52px;flex:none;border-radius:14px;background:#1F242B;border:1px solid var(--ln);position:relative;overflow:hidden}.thumb.s{width:40px;height:40px;border-radius:11px}
.artb{position:absolute;inset:0;background-position:center;background-repeat:no-repeat}
.tg{width:44px;height:44px;flex:none;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;background:#1F242B;border:1px solid var(--ln)}.tg.on{background:var(--ac);color:#0C0F12;border-color:var(--ac)}
.exp{border-top:1px solid var(--ln);margin:12px -12px 0;padding:12px 12px 2px}
.more{display:block;text-align:right;font-size:15px;font-weight:600;color:var(--ac);margin-top:6px;width:100%;min-height:44px}
.rr{margin-top:8px;padding:10px 12px;gap:10px;width:100%;text-align:left}
.rec{display:grid;grid-template-columns:64px 1fr;gap:8px;font-size:15px;line-height:1.4;margin-top:10px;align-items:center}.rec b{font-weight:600;color:var(--mut)}
.stat{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:10px 12px;min-width:0}.stat small{display:block;font-size:13px;color:var(--mut);font-weight:600}.stat b{font-family:var(--mono);font-size:18px;font-weight:600}
.specs{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:8px;color:var(--mut);font-size:15px}

.ctxt{margin-top:-6px;position:relative}
.gcard{margin-top:14px;padding:12px 8px 6px}
.hs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.hs.rods{padding:14px 18px 2px}.rchip{flex:none;display:flex;gap:10px;align-items:center;padding:8px 14px 8px 8px;border-radius:16px;background:var(--card);border:1px solid var(--ln);min-height:56px;max-width:230px}.rchip.on{border-color:var(--ac);background:#2A1A15}
.chart{margin-top:12px;padding:10px 6px 0}.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 10px;margin:12px 2px 4px;font-size:13px;font-weight:600}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:9px;height:9px;border-radius:5px}.legend b{color:var(--mut);font-weight:500}
.pr .lr{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:10px 12px;margin-top:8px}
.prog{height:4px;background:var(--ln);border-radius:2px;margin-top:12px}.prog i{display:block;height:4px;background:var(--ac);border-radius:2px}
.kind{gap:12px;padding:12px;width:100%;min-height:76px}
.pl{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--ln);font-size:16px}.pl .mut{text-align:right;font-size:15px}
.scale{position:relative;height:30px;margin-top:8px}.scale .t{position:absolute;top:5px;left:0;right:0;height:4px;border-radius:2px;background:var(--ln)}.scale .a{position:absolute;top:5px;height:4px;border-radius:2px;background:#E9EEF2}.scale .k{position:absolute;top:0;width:14px;height:14px;border-radius:7px;border:3px solid var(--bg);margin-left:-7px}.scale .n{position:absolute;top:14px;font-size:12px;color:var(--mut);transform:translateX(-50%);font-family:var(--mono)}
.empty{text-align:center;padding:30px 10px}.eph{width:140px;height:140px;border-radius:70px;margin:0 auto 20px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 40%,#2A1A15,#161A1F);border:1px solid var(--ln)}
.pin{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px;text-align:center;background:radial-gradient(70% 40% at 50% 0%,rgba(255,107,74,.16),rgba(12,15,18,0) 70%)}
.pin .ey{font-family:var(--mono);font-size:13px;color:var(--mut);letter-spacing:.3px}.pin .big{font-size:clamp(28px,8vw,36px);font-weight:700;letter-spacing:-.8px;line-height:1.1;text-wrap:balance}.pin .mut{font-size:15px}
.dots{display:flex;gap:14px;margin:26px 0}.dots i{width:14px;height:14px;border-radius:7px;border:1.5px solid var(--mut);transition:background .15s}.dots i.f{background:var(--ac);border-color:var(--ac)}.dots.sm{margin:12px 0 8px;gap:10px}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px}.keys button{height:76px;border-radius:38px;background:var(--card);border:1px solid var(--ln);font-size:26px;font-weight:500;font-family:var(--mono)}.keys button:active{background:rgba(255,107,74,.25)}
.toast{line-height:1.4;position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 16px);transform:translateX(-50%);background:#F4F6F8;color:#0C0F12;padding:12px 18px;border-radius:14px;font-size:15px;font-weight:600;z-index:99;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.tipc{flex:none;width:140px;display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:10px 12px;font-size:14px;color:var(--mut)}.tipc b{color:var(--tx);font-size:15px}.tipc input{font-size:16px;min-height:36px;background:transparent;color:var(--tx);border:0;outline:0;width:100%}
.sw{width:52px;height:32px;border-radius:16px;background:#2C333C;position:relative;flex:none}.sw.on{background:var(--ac)}.sw:after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:12px;background:#fff;transition:.2s}.sw.on:after{left:24px}
.apx{display:inline-flex;align-items:center;gap:6px;border-radius:9px;padding:5px 10px;min-height:36px;background:rgba(154,164,178,.16);color:#C6CDD6;font-weight:600;font-size:inherit;white-space:nowrap}.apx i{font-style:normal;font-size:11px;width:16px;height:16px;border-radius:8px;border:1px solid currentColor;display:inline-flex;align-items:center;justify-content:center}
button:active,.apx:active{opacity:.75}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:12px}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media(min-width:700px){body{padding-top:16px}}
.coil{width:40px;height:40px;border-radius:11px;background:#1F242B;display:flex;align-items:center;justify-content:center;flex:none}
.thumb.rl{width:44px;height:44px;border-radius:12px}.thumb.rd{background:#22272E}
.chero{height:300px}.chero .glow{background:radial-gradient(70% 60% at 60% 40%,#2A1A16 0%,rgba(12,15,18,0) 70%)}
.chero .cb{background:rgba(255,255,255,.1);border:0}.chero .pill{background:rgba(255,255,255,.1);border:0;backdrop-filter:none}
.cap.mono{font-family:var(--mono);letter-spacing:.6px}.specs span{color:var(--mut)}
.pr .lr{padding:12px}
</style></head><body><div id="app"></div><script src="app.js"></script></body></html>
