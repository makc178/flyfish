<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Снасти"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Нахлыст. Снасти</title>
<style>
@font-face{font-family:Manrope;src:url(Manrope.woff2) format('woff2');font-weight:200 800;font-display:swap}
@font-face{font-family:'Cormorant Garamond';src:url(Cormorant.woff2) format('woff2');font-weight:300 700;font-display:swap}
:root{--ink:#020F09;--gold:#AF9664;--green:#466859;--tile:#F2F2F2;--mut:#7d837f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#fff;color:var(--ink);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}input,select,textarea{font:inherit;color:inherit}
.ser{font-family:'Cormorant Garamond',Georgia,serif;font-variant-numeric:lining-nums}
.w{padding:0 20px}.top{padding-top:calc(env(safe-area-inset-top) + 14px)}
.big{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:40px;line-height:1;letter-spacing:-.4px;font-variant-numeric:lining-nums}
.ey{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700;color:var(--gold)}
.mut{color:var(--mut);font-size:12.5px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ph{background:var(--tile) center/contain no-repeat;border-radius:18px}
.chip{display:inline-block;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:20px;background:rgba(255,255,255,.85);backdrop-filter:blur(6px)}
.chip.g{background:var(--green);color:#fff}.chip.o{background:transparent;border:1px dashed var(--gold);color:#8a7444}
.seg{display:flex;background:var(--tile);border-radius:12px;padding:3px}.seg button{flex:1;text-align:center;padding:8px 4px;font-size:13px;font-weight:600;color:#5d625f;border-radius:10px;white-space:nowrap}.seg .on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(2,15,9,.12)}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 0 30%}
.tb{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));height:62px;border-radius:31px;background:rgba(255,255,255,.72);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(2,15,9,.06);box-shadow:0 10px 30px rgba(2,15,9,.14);display:flex;justify-content:space-around;align-items:center;z-index:20}
.tb button{font-size:11px;font-weight:700;color:#8a908c;flex:1;height:100%}.tb .on{color:var(--ink)}.tb i{display:block;width:6px;height:6px;border-radius:3px;margin:4px auto 0;background:var(--gold)}
.btn{display:block;width:100%;background:var(--ink);color:#fff;border-radius:16px;text-align:center;padding:16px;font-weight:700;font-size:15px}
.btn.l{background:var(--tile);color:var(--ink)}.btn.r{background:#fff;color:#9a3a2e;border:1px solid #ecd6d2}
.plus{width:34px;height:34px;border-radius:17px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.back{font-size:15px;font-weight:600}
.f{background:var(--tile);border-radius:14px;padding:10px 14px;display:block}.f small{display:block;font-size:10.5px;color:var(--mut);font-weight:600}.f input,.f select,.f textarea{display:block;width:100%;border:0;background:transparent;font-size:15px;font-weight:700;outline:0;padding:2px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.it{border-bottom:1px solid #eef0ee;padding:14px 0}.it .hd{display:flex;gap:14px;align-items:center;cursor:pointer}
.thumb{width:60px;height:60px;flex:none;border-radius:14px;background:var(--tile) center/80% no-repeat}
.nm{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600;line-height:1.05;margin-top:2px}
.exp{background:#f6f7f6;border-radius:18px;padding:12px;margin-top:12px}
.sub{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700;color:var(--mut);margin:10px 2px 6px}
.card{background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(2,15,9,.06)}
.scale{position:relative;height:22px;margin-top:4px}.scale .t{position:absolute;top:5px;left:0;right:0;height:4px;border-radius:2px;background:#e3e5e3}.scale .a{position:absolute;top:5px;height:4px;border-radius:2px;background:var(--green)}.scale .k{position:absolute;top:0;width:14px;height:14px;border-radius:7px;background:#fff;border:3px solid var(--ink);margin-left:-7px}.scale .n{position:absolute;top:13px;font-size:9.5px;color:var(--mut);transform:translateX(-50%)}
.rec{display:grid;grid-template-columns:72px 1fr;gap:4px 8px;font-size:12px}.rec b{color:var(--gold);font-weight:700}
.bdg{display:inline-block;font-size:11px;font-weight:600;color:#AF9664;background:rgba(175,150,100,.12);padding:3px 8px;border-radius:10px}
.more{display:block;text-align:right;font-size:12.5px;font-weight:700;margin-top:8px;width:100%}
.stat{background:var(--tile);border-radius:14px;padding:8px 10px}.stat small{display:block;font-size:10px;color:var(--mut);font-weight:600}.stat b{font-size:14px}
.empty{text-align:center;padding:40px 20px}.empty .ph{width:150px;height:150px;border-radius:75px;margin:0 auto 22px;background-size:70%}
.pin{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px;text-align:center}
.dots{display:flex;gap:14px;margin:26px 0}.dots i{width:13px;height:13px;border-radius:7px;border:1.5px solid var(--ink)}.dots i.f{background:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px}.keys button{height:76px;border-radius:38px;background:var(--tile);font-size:26px;font-weight:600}.keys button:active{background:#dfe3df}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 16px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-size:13px;font-weight:600;z-index:99;max-width:90%;text-align:center}
.tipc{flex:none;width:104px;border:1px solid #e6e8e6;border-radius:14px;padding:9px 10px;font-size:11px;color:var(--mut)}.tipc b{display:block;color:var(--ink);font-size:13px}
.hs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.sw{width:50px;height:30px;border-radius:15px;background:#d6dad7;position:relative;flex:none}.sw.on{background:var(--green)}.sw:after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;transition:.2s}.sw.on:after{left:23px}
.hero{height:300px;border-radius:0 0 26px 26px;background:var(--tile) center/80% no-repeat}
</style></head><body><div id="app"></div><script src="app.js"></script></body></html>
