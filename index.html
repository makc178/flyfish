:root{--bg:#13232B;--card:rgba(255,255,255,.10);--ln:rgba(255,255,255,.18);--tx:#FFFFFF;--mut:rgba(235,245,250,.68);--ac:#FFFFFF;--ok:#8EF0B6;--edge:#FFE08A;--fb:#FFB08F;--apx:#D4DCE4;--gl:blur(24px) saturate(1.5)}
