<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0A0D0C"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Снасти"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Нахлыст. Снасти</title>
<style>
@font-face{font-family:'Inter Tight';src:url(InterTight.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:Unbounded;src:url(Unbounded.woff2) format('woff2');font-weight:200 900;font-display:swap}
:root{--bg:#0A0D0C;--tx:#F2F5F3;--mut:#AEB7B2;--ac:#C8FF3C;--warn:#FFB547;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.10);--green:#C8FF3C}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}body{min-height:100vh;color:var(--tx);font-family:'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:radial-gradient(120% 60% at 80% 0%,#1d2a24 0%,rgba(10,13,12,0) 60%) no-repeat,var(--bg);padding-bottom:calc(120px + env(safe-area-inset-bottom));font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
#app{max-width:520px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}input,select,textarea{font:inherit;color:inherit}
.ser,.big,.nm,.h{font-family:Unbounded,system-ui,sans-serif}
.w{padding:0 16px}.top{padding-top:calc(env(safe-area-inset-top) + 14px)}
.big{font-weight:600;font-size:40px;line-height:.98;letter-spacing:-1.2px}
.ey{font-size:13px;font-weight:600;color:var(--mut);line-height:1.3}
.mut{color:var(--mut);font-size:14px;line-height:1.4}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.gl{background:var(--card);border:1px solid var(--bd);border-radius:24px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 20px 40px rgba(0,0,0,.45);position:relative;overflow:hidden}
.ph{background:radial-gradient(90% 90% at 50% 40%,#25342d,#121816) center no-repeat;border-radius:24px;border:1px solid var(--bd)}
.ph,.thumb,.hero,.empty .ph{background-size:contain}
.art{position:absolute;inset:0;background:center/80% no-repeat;filter:invert(1) hue-rotate(180deg) saturate(1.3) brightness(1.05);mix-blend-mode:screen;opacity:.92}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:1.25;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--card);border:1px solid var(--bd);white-space:nowrap}
.chip.g{background:var(--ac);color:#0A0D0C;border-color:var(--ac)}.chip.o{background:transparent;border:1px dashed var(--warn);color:var(--warn);white-space:normal}
.chip.nr{background:var(--ac);color:#0A0D0C;border-color:var(--ac);white-space:normal}
.seg{display:flex;gap:6px}.seg button{min-height:44px;padding:10px 16px;border-radius:99px;font-size:15px;font-weight:600;border:1px solid var(--bd);background:var(--card);color:var(--tx);white-space:nowrap}.seg .on{background:var(--tx);color:var(--bg)}
.seg.wrap{flex-wrap:wrap}
.tb{position:fixed;left:50%;transform:translateX(-50%);width:min(320px,calc(100% - 32px));bottom:calc(16px + env(safe-area-inset-bottom));height:60px;border-radius:30px;background:rgba(20,26,24,.62);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);border:1px solid var(--bd);box-shadow:0 20px 40px rgba(0,0,0,.5);display:flex;justify-content:space-around;align-items:center;padding:0 8px;z-index:20}
.tb button{font-size:14px;font-weight:700;color:var(--mut);min-height:44px;padding:10px 18px;border-radius:22px}.tb .on{background:var(--ac);color:#0A0D0C}.tb i{display:none}
.btn{display:block;width:100%;background:var(--ac);color:#0A0D0C;border-radius:18px;text-align:center;padding:16px;font-weight:700;font-size:15px}
.btn.l{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.r{background:transparent;color:#FF8A7A;border:1px solid rgba(255,138,122,.35)}
.plus{min-height:44px;padding:0 18px;border-radius:22px;background:var(--ac);color:#0A0D0C;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.back{font-size:16px;font-weight:600;min-height:44px;padding:0 4px}.pill{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:99px;background:rgba(20,26,24,.6);border:1px solid var(--bd);backdrop-filter:blur(12px);font-size:15px;font-weight:600}
.f{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 14px;display:block}.f small{display:block;font-size:13px;color:var(--mut);font-weight:600}.f input,.f select,.f textarea{display:block;width:100%;border:0;background:transparent;font-size:15px;font-weight:700;outline:0;padding:4px 0;font-size:17px;min-height:30px}
.f input::placeholder{color:var(--mut)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.it{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:12px;margin-bottom:10px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}.it .hd{display:flex;gap:12px;align-items:center;cursor:pointer}
.thumb{width:56px;height:56px;flex:none;border-radius:16px;background:radial-gradient(90% 90% at 50% 40%,#25342d,#121816);border:1px solid var(--bd);position:relative;overflow:hidden}
.tg{width:44px;height:44px;flex:none;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;background:var(--card);border:1px solid var(--bd)}.tg.on{background:var(--ac);color:#0A0D0C;border-color:var(--ac)}
.nm{font-family:'Inter Tight',sans-serif;font-size:18px;font-weight:700;line-height:1.2;letter-spacing:-.2px;margin-top:2px}
.exp{border-top:1px solid var(--bd);margin:12px -12px 0;padding:10px 12px 2px}
.sub{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;color:var(--mut);margin:10px 2px 6px}
.card{display:block;background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:18px;padding:10px 12px;margin-bottom:8px}
.ty{color:var(--ac);font-weight:700}
.scale{position:relative;height:30px;margin-top:6px}.scale .t{position:absolute;top:5px;left:0;right:0;height:4px;border-radius:2px;background:rgba(255,255,255,.12)}.scale .a{position:absolute;top:5px;height:4px;border-radius:2px;background:var(--ac)}.scale .k{position:absolute;top:0;width:14px;height:14px;border-radius:7px;background:#fff;border:3px solid #0A0D0C;margin-left:-7px;box-shadow:0 0 0 1px rgba(255,255,255,.4)}.scale .n{position:absolute;top:14px;font-size:11px;color:var(--mut);transform:translateX(-50%)}
.rec{display:grid;grid-template-columns:64px 1fr;gap:8px;font-size:14px;line-height:1.4}.rec b{color:var(--ac);font-weight:700}
.more{display:block;text-align:right;font-size:15px;font-weight:700;margin-top:4px;width:100%;min-height:44px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:9px 11px;min-width:0}.stat small{display:block;font-size:13px;color:var(--mut);font-weight:600}.stat b{font-family:'Inter Tight',sans-serif;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:40px 20px}.empty .ph{width:150px;height:150px;border-radius:75px;margin:0 auto 22px;position:relative;overflow:hidden}
.pin{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px;text-align:center}
.dots{display:flex;gap:14px;margin:26px 0}.dots i{width:13px;height:13px;border-radius:7px;border:1.5px solid var(--tx)}.dots i.f{background:var(--ac);border-color:var(--ac)}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px}.keys button{height:76px;border-radius:38px;background:var(--card);border:1px solid var(--bd);font-size:26px;font-weight:600}.keys button:active{background:rgba(200,255,60,.25)}.keys span{display:block}
.toast{line-height:1.4;font-size:15px;position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 16px);transform:translateX(-50%);background:var(--ac);color:#0A0D0C;padding:11px 18px;border-radius:16px;font-size:13px;font-weight:600;z-index:99;max-width:90%;text-align:center}
.tipc{flex:none;width:130px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 12px;font-size:13px;color:var(--mut)}.tipc b{display:block;color:var(--tx);font-size:15px}.tipc input{font-size:16px;min-height:36px}.tipc input{background:transparent;color:var(--tx)}
.hs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.sw{width:50px;height:30px;border-radius:15px;background:rgba(255,255,255,.18);position:relative;flex:none}.sw.on{background:var(--ac)}.sw:after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;transition:.2s}.sw.on:after{left:23px;background:#0A0D0C}
.hero{height:220px;margin:0 8px;border-radius:0 0 28px 28px;border-top:0;position:relative;overflow:hidden}
.bdg{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--warn);background:rgba(255,181,71,.13);border:1px solid rgba(255,181,71,.4);padding:3px 8px;border-radius:99px}
.apx{display:inline-flex;align-items:center;gap:5px;border:1px dashed var(--warn);border-radius:14px;padding:6px 10px;min-height:36px;font-weight:700;font-size:inherit;font-family:inherit;color:var(--tx);white-space:nowrap}.apx i{font-style:normal;font-family:'Inter Tight',sans-serif;font-size:11px;font-weight:700;width:16px;height:16px;border-radius:7px;border:1px solid var(--warn);color:var(--warn);display:inline-flex;align-items:center;justify-content:center}
.stat .apx{font-size:16px;padding:4px 8px;gap:4px;min-height:36px}.ln{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0;font-size:15px;font-weight:700;line-height:1.3}
.scale.ap{margin-top:26px}.apm{position:absolute;top:-30px;width:44px;height:40px;margin-left:-22px;display:flex;align-items:center;justify-content:center;color:var(--ac);font-weight:800;font-size:14px;cursor:pointer;z-index:2}
.blk{display:block;width:100%;text-align:left;color:var(--tx)}
.hn{font-family:Unbounded,sans-serif;font-weight:600;letter-spacing:-1px;line-height:1}
h1,.big{text-wrap:balance}
.big{font-size:clamp(30px,9vw,40px)}
button:active,.apx:active,.apm:active{opacity:.75;transform:scale(.98)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:12px}
.card:focus-visible,.it .hd:focus-visible{outline-offset:-2px}
.dots i{transition:background .15s}
.loading{opacity:.6}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important;scroll-behavior:auto!important}button:active{transform:none}}
@media(min-width:700px){body{padding-top:20px}}
</style></head><body><div id="app"></div><script src="app.js"></script></body></html>
